<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jinro GM FINAL</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#6d28d9">
</head>
<body>

<header class="header">
  <h1>🐺 Jinro GM</h1>
  <p>FINAL Edition</p>
</header>

<main>

  <!-- スタート画面 -->
  <section id="startScreen" class="card">
    <h2>ゲーム開始</h2>

    <label>プレイヤー人数</label>
    <select id="playerCount">
      <option>5</option>
      <option>6</option>
      <option>7</option>
      <option>8</option>
      <option selected>9</option>
      <option>10</option>
      <option>11</option>
      <option>12</option>
    </select>

    <div id="nameArea"></div>

    <button id="startBtn">配役する</button>
  </section>

  <!-- 役職確認 -->
  <section id="revealScreen" class="card hidden">
    <h2 id="playerName">プレイヤー</h2>

    <p>本人だけ見てください</p>

    <div id="roleCard">????</div>

    <button id="showRoleBtn">役職を見る</button>
    <button id="nextPlayerBtn" class="hidden">次の人へ</button>
  </section>

  <!-- ゲーム画面 -->
  <section id="gameScreen" class="card hidden">

    <h2 id="phase">1日目 夜</h2>

    <div class="status">
      <div>
        <span>生存者</span>
        <strong id="aliveCount">0</strong>
      </div>

      <div>
        <span>日数</span>
        <strong id="dayCount">1</strong>
      </div>
    </div>

    <div id="nightArea">
      <h3 id="nightRole">占い師</h3>

      <select id="targetSelect"></select>

      <button id="actionBtn">実行</button>

      <p id="resultText"></p>
    </div>

    <div id="voteArea" class="hidden">
      <h3>投票</h3>

      <select id="voteSelect"></select>

      <button id="voteBtn">処刑する</button>
    </div>

    <button id="nextPhaseBtn">朝にする</button>

    <div id="logArea"></div>

  </section>

</main>

<script src="app.js"></script>

</body>
</html>
